[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "caretta-symphony"
version = "0.1.0"
description = "Python implementation of OpenAI's Symphony service specification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CarettaAI" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "PyYAML>=6.0.2",
  "python-liquid>=1.12.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[project.scripts]
symphony = "symphony.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["symphony"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
